<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Võ Lâm Mật Tịch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">

    <aside id="sidebar">
      <div id="brand">
        <div class="mark">ABC</div>
      </div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Tìm chủ đề…">
      </div>
      <div id="sidebar-actions">
        <button id="new-folder-btn" type="button">+ Thư mục</button>
        <button id="new-note-btn" type="button">+ Chủ đề mới</button>
      </div>
      <div id="note-list"></div>

      <div id="storage-status">
        <div id="storage-status-text">Chưa kết nối GitHub</div>
        <button class="foot-btn wide" id="github-connect-btn">Đăng nhập GitHub để lưu</button>
        <button class="foot-btn wide" id="github-disconnect-btn" hidden>Ngắt kết nối GitHub</button>
      </div>

      <div id="sidebar-foot">
        <button class="foot-btn" id="export-btn">Xuất sao lưu</button>
        <button class="foot-btn" id="import-btn">Nhập lại</button>
        <input type="file" id="import-input" accept="application/json">
      </div>
    </aside>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <main id="main">
      <button id="sidebar-toggle" type="button" aria-label="Mở danh sách chủ đề" aria-expanded="false">☰</button>
      <div id="no-note" style="display:none;">
        <div class="serif">Chưa có chủ đề nào được chọn</div>
        <div>Chọn một chủ đề bên trái, hoặc tạo chủ đề mới để bắt đầu ghi chú.</div>
        <button id="no-note-create">+ Tạo chủ đề mới</button>
      </div>

      <div id="note-view" style="display:none; flex:1; flex-direction:column; min-height:100%;">
        <div id="editor-head">
          <input id="title-input" placeholder="Tiêu đề chủ đề…">
          <div id="meta-row">
            <span id="updated-at"></span>
            <span id="save-state"></span>
          </div>
        </div>

        <div id="toolbar">
          <div class="tb-group" aria-label="Kiểu đoạn">
            <button class="tb-btn" data-block="P" title="Văn bản thường">¶</button>
            <button class="tb-btn" data-block="H1" title="Tiêu đề 1">H1</button>
            <button class="tb-btn" data-block="H2" title="Tiêu đề 2">H2</button>
            <button class="tb-btn" data-block="H3" title="Tiêu đề 3">H3</button>
          </div>
          <div class="tb-group" aria-label="Định dạng chữ">
            <button class="tb-btn" data-cmd="bold" title="In đậm"><b>B</b></button>
            <button class="tb-btn" data-cmd="italic" title="In nghiêng"><i>I</i></button>
            <button class="tb-btn" data-cmd="underline" title="Gạch chân"><u>U</u></button>
            <button class="tb-btn" id="btn-clear-format" title="Xoá định dạng, đưa về font/size chuẩn của trang">Tẩy định dạng</button>
          </div>
          <div class="tb-group" aria-label="Căn ngang">
            <button class="tb-btn" data-align="left" title="Căn ngang: Trái (Đoạn văn hoặc Ô bảng)">← Trái</button>
            <button class="tb-btn" data-align="center" title="Căn ngang: Giữa (Đoạn văn hoặc Ô bảng)">↔ Giữa</button>
            <button class="tb-btn" data-align="right" title="Căn ngang: Phải (Đoạn văn hoặc Ô bảng)">→ Phải</button>
          </div>
          <div class="tb-group" aria-label="Căn dọc">
            <button class="tb-btn" data-valign="top" title="Căn dọc: Trên (Ô trong bảng)">↑ Trên</button>
            <button class="tb-btn" data-valign="middle" title="Căn dọc: Giữa (Ô trong bảng)">↕ Giữa</button>
            <button class="tb-btn" data-valign="bottom" title="Căn dọc: Dưới (Ô trong bảng)">↓ Dưới</button>
          </div>
          <div class="tb-group" aria-label="Danh sách">
            <button class="tb-btn" data-cmd="insertUnorderedList" title="Danh sách chấm">• Danh sách</button>
            <button class="tb-btn" data-cmd="insertOrderedList" title="Danh sách số">1. Danh sách</button>
            <button class="tb-btn" id="btn-list-alpha" title="Danh sách chữ (a, b, c)">a. Danh sách</button>
          </div>
          <div class="tb-group" aria-label="Chèn nội dung">
            <button class="tb-btn" id="btn-check" title="Chèn mục kiểm tra Đúng/Sai (cả dòng)">☑ Dòng Đ/S</button>
            <button class="tb-btn" id="btn-icon" title="Chèn icon Đúng/Sai nhỏ, đặt được vào ô bảng hoặc bất kỳ đâu">◐ Icon Đ/S</button>
            <button class="tb-btn" id="btn-table" title="Chèn bảng (kéo được viền để đổi kích thước hàng/cột)">▦ Bảng</button>
            <button class="tb-btn" data-block="BLOCKQUOTE" title="Trích dẫn / ghi chú">❝ Ghi chú</button>
          </div>
          <div class="tb-group tb-group-hl" aria-label="Màu chữ">
            <span class="tb-hl-label" title="Bôi đen đoạn văn bản cần đổi màu, rồi bấm 1 màu bên dưới">🖊 Màu chữ</span>
            <button class="tb-swatch tb-swatch-text" data-textcolor="#c26b0d" title="Cam đất" style="color:#c26b0d">A</button>
            <button class="tb-swatch tb-swatch-text" data-textcolor="#2e7d32" title="Xanh lá" style="color:#2e7d32">A</button>
            <button class="tb-swatch tb-swatch-text" data-textcolor="#1565c0" title="Xanh dương" style="color:#1565c0">A</button>
            <button class="tb-swatch tb-swatch-text" data-textcolor="#c2185b" title="Hồng" style="color:#c2185b">A</button>
            <button class="tb-swatch tb-swatch-text" data-textcolor="#c62828" title="Đỏ" style="color:#c62828">A</button>
            <button class="tb-swatch tb-swatch-custom" id="btn-highlight-custom" title="Chọn màu khác…">🎨</button>
            <button class="tb-swatch tb-swatch-none" id="btn-highlight-clear" title="Bỏ màu chữ, về màu mặc định">✕</button>
          </div>
          <div class="tb-group tb-group-arrow" aria-label="Mũi tên logic">
            <span class="tb-hl-label" title="Đặt con trỏ vào vị trí cần chèn rồi bấm 1 hướng bên dưới">↗ Logic</span>
            <button class="tb-btn tb-arrow-btn" data-arrow="↑" aria-label="Chèn mũi tên lên" title="Mũi tên lên — thể hiện tăng / đi lên">↑</button>
            <button class="tb-btn tb-arrow-btn" data-arrow="↓" aria-label="Chèn mũi tên xuống" title="Mũi tên xuống — thể hiện giảm / đi xuống">↓</button>
            <button class="tb-btn tb-arrow-btn" data-arrow="←" aria-label="Chèn mũi tên trái" title="Mũi tên trái — thể hiện nguyên nhân / quay lại">←</button>
            <button class="tb-btn tb-arrow-btn" data-arrow="→" aria-label="Chèn mũi tên phải" title="Mũi tên phải — thể hiện dẫn đến / kết quả">→</button>
          </div>
        </div>

        <div id="editor-scroll">
          <div id="editor-wrap">
            <div id="editor" contenteditable="true" data-placeholder="Bắt đầu ghi lại kiến thức của bạn…"></div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <div id="modal-bg">
    <div id="modal">
      <p id="modal-text">Bạn có chắc muốn xoá?</p>
      <div class="modal-btns">
        <button class="btn-cancel" id="modal-cancel">Huỷ</button>
        <button class="btn-danger" id="modal-ok">Xoá</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
